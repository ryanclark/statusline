<!doctype html>
<meta charset="utf-8">
<style>
{{style}}
</style>

<div class="win" id="win">
	<div class="bar">
		<div class="dot close"></div>
		<div class="dot minimize"></div>
		<div class="dot zoom"></div>
	</div>
	<div class="body">
		{{body}}
	</div>
</div>

<script>
	// The laid out size including margins, so the screenshot fits the longest row exactly.
	document.fonts.ready.then(() => {
		const win = document.getElementById("win")
		const style = getComputedStyle(win)
		const width = win.offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight)
		const height = win.offsetHeight + parseFloat(style.marginTop) + parseFloat(style.marginBottom)
		document.body.dataset.size = `${width}x${height}`
	})
</script>
