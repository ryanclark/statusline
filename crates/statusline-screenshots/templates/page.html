<!doctype html>
<meta charset="utf-8">
<style>
{{style}}
</style>

<div class="win" id="win">
	<div class="bar">
		<div class="dot close"></div>
		<div class="dot minimize"></div>
		<div class="dot zoom"></div>
	</div>
	<div class="body">
		<div class="header">
			<!-- Claude Code's welcome mascot as pixel rects on an 11x8 grid. -->
			<svg class="mascot" viewBox="0 0 11 8" shape-rendering="crispEdges">
				<rect x="1" y="0" width="9" height="5" fill="#d97757"/>
				<rect x="0" y="2" width="11" height="2" fill="#d97757"/>
				<rect x="3" y="1" width="1" height="2" fill="#04080c"/>
				<rect x="7" y="1" width="1" height="2" fill="#04080c"/>
				<rect x="2" y="5" width="1" height="2" fill="#d97757"/>
				<rect x="3.6" y="5" width="1" height="2" fill="#d97757"/>
				<rect x="6.4" y="5" width="1" height="2" fill="#d97757"/>
				<rect x="8" y="5" width="1" height="2" fill="#d97757"/>
			</svg>
			<div>
				<div><span class="title">Claude Code</span> <span class="dim">v{{version}}</span></div>
				<div class="dim">{{model}} · {{plan}}</div>
				<div class="dim">{{cwd}}</div>
			</div>
		</div>
		{{transcript}}
		<div class="rule"></div>
		<div class="row prompt">❯ {{prompt}}<span class="cursor"></span></div>
		<div class="rule"></div>
		{{status}}
		{{panel}}
	</div>
</div>

<script>
	// The laid out size including margins, so the screenshot fits the longest row exactly.
	document.fonts.ready.then(() => {
		const win = document.getElementById("win")
		const style = getComputedStyle(win)
		const width = win.offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight)
		const height = win.offsetHeight + parseFloat(style.marginTop) + parseFloat(style.marginBottom)
		document.body.dataset.size = `${width}x${height}`
	})
</script>
